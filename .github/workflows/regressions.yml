name: Regression checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regressions:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      BINANCE_API_KEY: ''
      BINANCE_API_SECRET: ''
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q nightwatch nightwatch_futures.py
      - name: Typography UI at 1080p and 1440p
        run: python -m pytest -q tests/test_typography_ui.py
      - run: python -m pytest -q
